[project]
name = "decimer-onnx-export"
version = "0.1.0"
description = "Export/quantize DECIMER models to ONNX (TensorFlow isolated here)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "decimer==2.8.1",
  "numpy>=1.26,<2",
  "onnx==1.16.2",
  "onnxruntime>=1.18,<2",
  "pyyaml>=6.0",
  "sympy>=1.12",
  "tensorflow-cpu==2.15.1",
  "tf2onnx==1.16.1",
  "typer>=0.12",
]

[project.scripts]
decimer-export = "decimer_onnx_export.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decimer_onnx_export"]
