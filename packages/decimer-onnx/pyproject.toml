[project]
name = "decimer-onnx"
version = "0.1.0"
description = "Runtime for DECIMER ONNX artifacts (no TensorFlow)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<2",
  "onnxruntime>=1.18,<2",
  "pillow>=10.0",
  "typer>=0.12",
]

[project.scripts]
decimer-onnx = "decimer_onnx.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decimer_onnx"]
